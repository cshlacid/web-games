<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-games</title>
<meta name="description" content="브라우저에서 바로 하는 미니 게임 모음">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23edc22e'><circle cx='12' cy='5.5' r='3.5'/><rect x='11' y='7' width='2' height='9'/><path d='M4 21 L7 15.5 H17 L20 21 Z'/></svg>">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<main class="hub">
  <header>
    <h1>web-games</h1>
    <p class="tagline">브라우저에서 바로 하는 미니 게임 모음</p>
  </header>

  <ul class="games">
    <li>
      <a class="card" href="games/2048/">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="8.5" height="8.5" rx="2"/><rect x="2" y="13" width="8.5" height="8.5" rx="2"/><rect x="13" y="2.5" width="9" height="19" rx="2" fill="currentColor" stroke="none"/></svg>
        <span class="card-body">
          <span class="card-title">2048</span>
          <span class="card-desc">같은 숫자를 밀어 붙여 2048을 만든다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/kkodle/">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="2" width="8" height="6" rx="1.6"/><rect x="13" y="2" width="8" height="6" rx="1.6"/><rect x="3" y="9" width="8" height="6" rx="1.6" fill="currentColor" stroke="none"/><rect x="13" y="9" width="8" height="6" rx="1.6"/><rect x="3" y="16" width="8" height="6" rx="1.6" fill="currentColor" stroke="none"/><rect x="13" y="16" width="8" height="6" rx="1.6" fill="currentColor" stroke="none"/></svg>
        <span class="card-body">
          <span class="card-title">꼬들</span>
          <span class="card-desc">두 글자 한글 단어를 여섯 번 안에 맞힌다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/sudoku/">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M2 8.7 H22" opacity=".45"/><path d="M2 15.3 H22" opacity=".45"/><path d="M8.7 2 V22" opacity=".45"/><path d="M15.3 2 V22" opacity=".45"/><rect x="10" y="10" width="4" height="4" rx="1" fill="currentColor" stroke="none"/></svg>
        <span class="card-body">
          <span class="card-title">스도쿠</span>
          <span class="card-desc">힌트만으로 풀린다 — 찍어야 하는 판은 나오지 않는다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/doppelblock/">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="7" width="21" height="10" rx="2"/><path d="M5.7 7 V17" opacity=".45"/><path d="M9.9 7 V17" opacity=".45"/><path d="M14.1 7 V17" opacity=".45"/><path d="M18.3 7 V17" opacity=".45"/><rect x="5.7" y="7" width="4.2" height="10" fill="currentColor" stroke="none"/><rect x="14.1" y="7" width="4.2" height="10" fill="currentColor" stroke="none"/></svg>
        <span class="card-body">
          <span class="card-title">더블블록</span>
          <span class="card-desc">검은 칸 사이 숫자의 합을 맞힌다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/chess-puzzle/">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5.2" r="3.9" fill="currentColor" stroke="none"/><path d="M9 8.8 C9 11.6 7.6 12.6 7.6 14.2 H16.4 C16.4 12.6 15 11.6 15 8.8 Z" fill="currentColor" stroke="none"/><rect x="6.2" y="14.2" width="11.6" height="2.6" rx="1" fill="currentColor" stroke="none"/><path d="M4 22 C4 18.6 7.2 17.2 12 17.2 C16.8 17.2 20 18.6 20 22 Z" fill="currentColor" stroke="none"/></svg>
        <span class="card-body">
          <span class="card-title">체스 퍼즐</span>
          <span class="card-desc">가장 강한 수를 찾아 전술을 푼다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/zip/">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 4.5 H19.5 L4.5 12 H19.5 L4.5 19.5 H19.5"/><circle cx="4.5" cy="4.5" r="2.2" fill="currentColor" stroke="none"/><circle cx="19.5" cy="19.5" r="2.2" fill="currentColor" stroke="none"/></svg>
        <span class="card-body">
          <span class="card-title">한붓그리기</span>
          <span class="card-desc">숫자를 순서대로 밟으며 모든 칸을 한 번씩 지난다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/healer/">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 H14 V10 H21 V14 H14 V21 H10 V14 H3 V10 H10 Z" fill="currentColor" stroke="none"/></svg>
        <span class="card-body">
          <span class="card-title">힐러 <b class="badge">알파</b></span>
          <span class="card-desc">파티에서 힐러 하나만 맡는다</span>
        </span>
      </a>
    </li>
  </ul>

  <footer>
    <a href="https://github.com/cshlacid/web-games">GitHub</a>
  </footer>
</main>
</body>
</html>
