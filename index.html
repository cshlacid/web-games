<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>web-games</title>
<meta name="description" content="브라우저에서 바로 하는 미니 게임 모음">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🕹️</text></svg>">
<link rel="stylesheet" href="hub.css">
</head>
<body>
<main class="hub">
  <header>
    <h1>web-games</h1>
    <p class="tagline">브라우저에서 바로 하는 미니 게임 모음</p>
  </header>

  <ul class="games">
    <li>
      <a class="card" href="games/2048/">
        <span class="emoji" aria-hidden="true">🎲</span>
        <span class="card-body">
          <span class="card-title">2048</span>
          <span class="card-desc">같은 숫자를 밀어 붙여 2048을 만든다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/kkodle/">
        <span class="emoji" aria-hidden="true">🟩</span>
        <span class="card-body">
          <span class="card-title">꼬들</span>
          <span class="card-desc">두 글자 한글 단어를 여섯 번 안에 맞힌다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/sudoku/">
        <span class="emoji" aria-hidden="true">🔢</span>
        <span class="card-body">
          <span class="card-title">스도쿠</span>
          <span class="card-desc">힌트만으로 풀린다 — 찍어야 하는 판은 나오지 않는다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/doppelblock/">
        <span class="emoji" aria-hidden="true">⬛</span>
        <span class="card-body">
          <span class="card-title">더블블록</span>
          <span class="card-desc">검은 칸 사이 숫자의 합을 맞힌다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/chess-puzzle/">
        <span class="emoji" aria-hidden="true">♟️</span>
        <span class="card-body">
          <span class="card-title">체스 퍼즐</span>
          <span class="card-desc">가장 강한 수를 찾아 전술을 푼다</span>
        </span>
      </a>
    </li>
    <li>
      <a class="card" href="games/healer/">
        <span class="emoji" aria-hidden="true">✚</span>
        <span class="card-body">
          <span class="card-title">힐러 <b class="badge">알파</b></span>
          <span class="card-desc">파티에서 힐러 하나만 맡는다</span>
        </span>
      </a>
    </li>
  </ul>

  <footer>
    <a href="https://github.com/cshlacid/web-games">GitHub</a>
  </footer>
</main>
</body>
</html>
