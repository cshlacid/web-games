<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title data-i18n="game.rushhour">차 빼기</title>
<meta name="description" content="막힌 차들을 밀어 빨간 차를 빼내는 퍼즐" data-i18n-attr="content=meta.desc">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='2' y='2' width='20' height='20' rx='3' fill='%23e7e2d8'/><rect x='3.5' y='10' width='12' height='4' rx='1.6' fill='%23c0402f'/><rect x='4' y='3.5' width='4' height='5' rx='1.4' fill='%236f7d86'/><rect x='16' y='15.5' width='4' height='5' rx='1.4' fill='%236f7d86'/></svg>">
<link rel="manifest" href="../../manifest.json">
<link rel="apple-touch-icon" href="../../icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="차 빼기" data-i18n-attr="content=game.rushhour">
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../../shared/base.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../../shared/result.css">
<link rel="stylesheet" href="../../shared/sheet.css">
<script src="../../shared/analytics.js"></script>
<script src="../../shared/i18n.js"></script>
<script src="../../shared/strings.js"></script>
<script src="strings.js"></script>
</head>
<body>
<main class="app">
  <header class="head">
    <div class="title-row">
      <div class="head-nav">
        <a class="back" href="../../" data-i18n="ui.back">← 목록</a>
        <button class="toggle" id="help-open" type="button" aria-pressed="false" data-i18n="ui.help">도움말</button>
      </div>
      <h1 data-i18n="game.rushhour">차 빼기</h1>
      <div class="head-actions">
        <button class="toggle sound" id="toggle-bgm" type="button" aria-pressed="true" data-i18n="ui.bgm">BGM</button>
        <button class="toggle sound" id="toggle-sfx" type="button" aria-pressed="true" data-i18n="ui.sfx">효과음</button>
      </div>
    </div>
    <div class="picker-row">
      <div class="picker" id="levels" role="group" aria-label="난이도" data-i18n-attr="aria-label=ui.difficulty"></div>
      <span class="count" id="count"></span>
      <span class="best" id="best"></span>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="result" id="result" role="status" aria-live="polite" hidden>
      <div class="result-card">
        <p class="sheet-title" id="result-title"></p>
        <p class="sheet-note" id="result-note"></p>
        <div class="sheet-actions">
          <button class="btn" id="again" type="button" data-i18n="ui.nextBoard">다음 판</button>
        </div>
      </div>
    </div>
  </div>

  <p class="toast" id="toast" role="status" aria-live="polite"></p>

  <div class="pad">
    <div class="tools">
      <button class="tool" id="undo" type="button">
        <span class="tool-icon" data-icon="undo"></span><span class="tool-label" data-i18n="ui.undo">되돌리기</span>
      </button>
      <button class="tool" id="reset" type="button">
        <span class="tool-icon" data-icon="restart"></span><span class="tool-label" data-i18n="ui.toStart">처음으로</span>
      </button>
      <button class="tool" id="hint" type="button">
        <span class="tool-icon" data-icon="hint"></span><span class="tool-label" data-i18n="ui.hint">힌트</span>
      </button>
      <button class="tool" id="new-game" type="button">
        <span class="tool-icon" data-icon="plus"></span><span class="tool-label" data-i18n="ui.newBoard">새 판</span>
      </button>
    </div>
  </div>

  <div class="sheet" id="help" hidden>
    <p class="sheet-title" data-i18n="ui.rules">규칙</p>
    <ul class="help-list">
      <li data-i18n-html="rushhour.rule1"><b>빨간 차를 오른쪽 끝으로</b> 빼내면 끝납니다.</li>
      <li data-i18n-html="rushhour.rule2">차는 <b>제 방향으로만</b> 움직입니다. 가로 차는 좌우로, 세로 차는 위아래로만
        가고, 돌리거나 넘어갈 수 없습니다.</li>
      <li data-i18n-html="rushhour.rule3">차를 <b>밀어서</b> 옮기세요. 짧게 누르면 그쪽으로 한 칸 갑니다.</li>
      <li data-i18n-html="rushhour.rule4"><b>몇 칸을 가든 한 수</b>로 셉니다. 판마다 <b>최소 수</b>가 적혀 있으니 그 수에
        맞춰 보세요.</li>
      <li data-i18n-html="rushhour.rule5"><b>힌트</b>는 최소 풀이의 다음 한 수를 대신 둬 줍니다. 힌트를 쓴 판은 기록에
        넣지 않습니다.</li>
      <li data-i18n-html="rushhour.rule6">모든 판은 <b>반드시 풀립니다.</b> 적힌 최소 수도 실제로 풀어 본 값입니다.</li>
    </ul>
    <div class="sheet-actions">
      <button class="btn" id="help-close" type="button" data-i18n="ui.close">닫기</button>
    </div>
  </div>
</main>

<script>SharedI18n.apply();</script>
<script src="../../shared/base.js"></script>
<script src="../../shared/icons.js"></script>
<script src="rules.js"></script>
<script src="solver.js"></script>
<script src="puzzles.js"></script>
<script src="generator.js"></script>
<script src="../../shared/audio.js"></script>
<script src="audio.js"></script>
<script src="../../shared/sheet.js"></script>
<script src="main.js"></script>
</body>
</html>
